services:
  - type: web
    name: sistema-joice-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: |
      npm ci
      npm run build
      npx prisma generate
    # migrate no start (preDeployCommand só existe em planos pagos)
    startCommand: npx prisma migrate deploy && npm run start
    autoDeploy: true
    envVars:
      - key: PORT
        value: 4000
      # SQLite efêmero no plano free (sem Disk)
      - key: DATABASE_URL
        value: file:/tmp/sistemajoice.db
      - key: JWT_SECRET
        generateValue: true
      - key: UPLOAD_DIR
        value: /tmp/uploads
      - key: SEED_ON_START
        value: "true"

  - type: web
    name: sistema-joice-frontend
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: |
      npm ci
      npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false
